
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<title>Advertisement</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" />

<style>
* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  min-height: 0;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent;
}

body {
  font-family: 'Tajawal', Arial, sans-serif;
}

.mtg-ad {
  width: 100%;
  height: 100%;
  min-height: 0;
  margin: 0 auto;
  padding: 20px 18px 12px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  direction: rtl;
  overflow: hidden;
  border: 1px solid #d6b85c;
  border-radius: 7px;
  background:
    radial-gradient(ellipse at 15% 50%, #54218a 0%, transparent 55%),
    linear-gradient(110deg, #10091f, #211039 55%, #10091f);
  color: #fff;
  isolation: isolate;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.mtg-ad::before {
  content: "";
  position: absolute;
  width: 220px;
  height: 220px;
  left: -75px;
  top: -100px;
  border: 1px solid rgba(220,180,65,.22);
  border-radius: 50%;
  box-shadow:
    0 0 0 20px rgba(220,180,65,.035),
    0 0 0 40px rgba(220,180,65,.025);
  z-index: -1;
  pointer-events: none;
}

.mtg-ad-label {
  position: absolute;
  top: 0;
  left: 0;
  padding: 4px 10px;
  background: rgba(0,0,0,.35);
  border-bottom: 1px solid rgba(214,184,92,.4);
  border-radius: 0 0 6px 0;
  color: #d8c9a2;
  font-family: Arial, sans-serif;
  font-size: 9px;
  letter-spacing: .4px;
  direction: ltr;
  z-index: 2;
}

.mtg-content {
  flex: 1;
  min-width: 0;
}

.mtg-brand {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #e5c45c;
  font-size: 13px;
  font-weight: 900;
  margin-bottom: 4px;
}

.mtg-brand svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.mtg-title {
  font-size: clamp(16px, 2.6vw, 23px);
  font-weight: 900;
  line-height: 1.4;
  color: #fff;
}

.mtg-title span {
  color: #f2ce68;
}

.mtg-description {
  color: #e5d9f5;
  font-size: 12px;
  margin-top: 4px;
  font-weight: 500;
  line-height: 1.5;
}

.mtg-features {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 5px 13px;
  margin-top: 8px;
}

.mtg-feature {
  display: flex;
  align-items: center;
  color: #e5d9f5;
  font-size: 14px;
  white-space: nowrap;
  font-weight: 500;
}

.mtg-feature svg {
  width: 13px;
  height: 13px;
  margin-left: 4px;
  flex-shrink: 0;
}

.mtg-feature:not(.mtg-payment) svg {
  color: #eac85c;
}

.mtg-payment-title {
  color: #eac85c;
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
}

.mtg-payment {
  gap: 4px;
}

.mtg-payment svg {
  width: 19px;
  height: 15px;
  margin-left: 2px;
}

.mtg-action {
  flex-shrink: 0;
  margin-right: 15px;
  text-align: center;
}

.mtg-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 11px 18px;
  border-radius: 6px;
  background: linear-gradient(135deg, #ffe58a, #c69b32);
  color: #21132a !important;
  font-size: 14px;
  font-weight: 900;
  text-decoration: none !important;
  box-shadow: 0 4px 15px rgba(230,185,65,.25);
  transition: transform .2s ease, box-shadow .2s ease;
  cursor: pointer;
}

.mtg-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 22px rgba(230,185,65,.4);
}

.mtg-caption {
  color: #fff;
  font-size: 12px;
  margin-top: 7px;
  font-weight: 500;
}

/* الجوال */
@media (max-width: 600px) {
  .mtg-ad {
    width: 100%;
    height: 100%;
    min-height: 0;
    padding: 25px 12px 10px;
    flex-direction: column;
    justify-content: flex-start;
    align-items: stretch;
    text-align: center;
    border-radius: 7px;
  }

  .mtg-ad::before {
    width: 200px;
    height: 200px;
    left: -85px;
    top: -65px;
  }

  .mtg-content {
    width: 100%;
    flex: 1 1 auto;
    min-width: 0;
  }

  .mtg-brand {
    justify-content: center;
    font-size: 12px;
    margin-bottom: 7px;
  }

  .mtg-brand svg {
    width: 15px;
    height: 15px;
  }

  .mtg-title {
    font-size: clamp(16px, 5vw, 19px);
    line-height: 1.4;
  }

  .mtg-description {
    font-size: 11px;
    line-height: 1.5;
    margin-top: 5px;
  }

  .mtg-features {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    justify-items: start;
    align-items: center;
    gap: 9px 4px;
    margin-top: 13px;
    padding: 0 2px;
  }

  .mtg-feature {
    font-size: clamp(10px, 3vw, 12px);
    white-space: nowrap;
    justify-content: flex-start;
  }

  .mtg-feature svg {
    width: 13px;
    height: 13px;
    margin-left: 4px;
  }

  .mtg-payment-title {
    grid-column: 1 / -1;
    justify-self: center;
    font-size: 12px;
    margin-top: 3px;
    padding-top: 7px;
    width: 100%;
    border-top: 1px solid rgba(214,184,92,.25);
  }

  .mtg-payment {
    justify-self: center;
    font-size: 12px;
  }

  .mtg-payment svg {
    width: 19px;
    height: 16px;
  }

  .mtg-action {
    width: 100%;
    flex: 0 0 auto;
    margin: 8px 0 0;
    padding-top: 7px;
  }

  .mtg-button {
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
  }

  .mtg-caption {
    font-size: 11px;
    margin-top: 5px;
  }
}

/* الشاشات الصغيرة جداً */
@media (max-width: 280px) {
  .mtg-ad {
    padding-left: 8px;
    padding-right: 8px;
  }

  .mtg-feature {
    font-size: 10px;
  }

  .mtg-description {
    font-size: 10px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .mtg-button {
    transition: none;
  }
}
</style>

<div class="mtg-ad" id="mtg-ad">

  <div class="mtg-ad-label">
    Ads by Eshha
  </div>

  <div class="mtg-content">

    <div class="mtg-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 2.8l2.1 5.5 5.5 2.1-5.5 2.1-2.1 5.5-2.1-5.5-5.5-2.1 5.5-2.1z"></path>
        <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"></circle>
      </svg>
      MONETAG | شبكة الإعلانات الرقمية
    </div>

    <div class="mtg-title">
      موقعك يستحق أرباحاً أفضل مع
      <span>Monetag</span>
    </div>

    <div class="mtg-description">
      حوّل زيارات موقعك أو مدونتك إلى فرصة حقيقية لتحقيق الأرباح.
    </div>

    <div class="mtg-features">

      <div class="mtg-feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 19V5"></path>
          <path d="M3 19h18"></path>
          <path d="M6 15l5-5 4 3 6-7"></path>
          <path d="M16 6h5v5"></path>
        </svg>
        معدلات CPM تنافسية
      </div>

      <div class="mtg-feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3l8 3v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"></path>
          <path d="M8 12l3 3 5-6"></path>
        </svg>
        بيئة إعلانية آمنة
      </div>

      <div class="mtg-feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"></rect>
          <rect x="14" y="3" width="7" height="7" rx="1"></rect>
          <rect x="3" y="14" width="7" height="7" rx="1"></rect>
          <rect x="14" y="14" width="7" height="7" rx="1"></rect>
        </svg>
        أشكال إعلانية متعددة
      </div>

      <div class="mtg-feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"></circle>
          <path d="M8 12l3 3 5-6"></path>
        </svg>
        قبول فوري لموقعك
      </div>

      <div class="mtg-payment-title">
        طرق الدفع:
      </div>

      <div class="mtg-feature mtg-payment">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="1" y="3" width="22" height="18" rx="3" fill="#003087"></rect>
          <path d="M8 6h6a3.5 3.5 0 0 1 0 7H11l-1.3 5H6.5L8 6z" fill="#fff"></path>
          <path d="M11 9h4a2.5 2.5 0 0 1 0 5h-4l-.8 3H7.5L11 9z" fill="#009CDE"></path>
        </svg>
        بايبال
      </div>

      <div class="mtg-feature mtg-payment">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 3h10a6 6 0 0 1 0 12H9l-2 6H3L4 3z" fill="#F5A623"></path>
          <path d="M9 6h10a4 4 0 0 1 0 8h-6l-1.5 5H7L9 6z" fill="#E32636"></path>
        </svg>
        بايونير
      </div>

    </div>
  </div>

  <div class="mtg-action">
    <a
      class="mtg-button"
      href="https://monetag.com/?ref_id=nIvH"
      target="_blank"
      rel="nofollow sponsored noopener noreferrer"
    >
      انضم الآن »
    </a>

    <div class="mtg-caption">
      ابدأ رحلتك نحو الأرباح
    </div>
  </div>

</div>

<script>
(function () {
  var banner = document.getElementById('mtg-ad');
  if (!banner) return;

  var targetUrl = 'https://monetag.com/?ref_id=nIvH';

  banner.addEventListener('click', function (event) {
    // اترك زر الانضمام يعمل برابطه الأصلي
    if (event.target.closest('a')) return;

    // الضغط على أي مكان آخر داخل البانر
    window.open(targetUrl, '_blank', 'noopener,noreferrer');
  });
})();
</script>
